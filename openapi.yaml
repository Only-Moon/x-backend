openapi: 3.1.1
info:
  title: Keepset API
  description: External memory for notes, checklists, planners, and reminders
  version: 1.0.0
servers:
  - url: https://x-backend-eta.vercel.app
security:
  - BearerAuth: []
paths:
  /api/v1/workspace/init:
    post:
      summary: Initialize a new anonymous workspace
      operationId: initWorkspace
      security: []
      responses:
        "201":
          description: Workspace initialized
          content:
            application/json:
              schema:
                type: object
                required:
                  - workspace_token
                properties:
                  workspace_token:
                    type: string
  /api/v1/items:
    post:
      summary: Create a new item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    get:
      summary: List items
      operationId: listItems
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - note
              - checklist
              - planner
      responses:
        "200":
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
  /api/v1/items/{id}:
    patch:
      summary: Update an item
      operationId: updateItem
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateItemRequest:
      type: object
      required:
        - type
        - title
        - content
      properties:
        type:
          type: string
          enum:
            - note
            - checklist
            - planner
        title:
          type: string
        content:
          oneOf:
            - $ref: "#/components/schemas/NoteContent"
            - $ref: "#/components/schemas/ChecklistContent"
            - $ref: "#/components/schemas/SectionedContent"
        pinned:
          type: boolean
          default: false
    UpdateItemRequest:
      type: object
      properties:
        title:
          type: string
        content:
          oneOf:
            - $ref: "#/components/schemas/NoteContent"
            - $ref: "#/components/schemas/ChecklistContent"
            - $ref: "#/components/schemas/SectionedContent"
        pinned:
          type: boolean
    NoteContent:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        remind_at:
          type: string
          format: date-time
    ChecklistContent:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - text
              - done
            properties:
              text:
                type: string
              done:
                type: boolean
              remind_at:
                type: string
                format: date-time
    SectionedContent:
      type: object
      required:
        - sections
      properties:
        sections:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - title
            properties:
              title:
                type: string
              items:
                type: array
                items:
                  type: object
                  required:
                    - text
                    - done
                  properties:
                    text:
                      type: string
                    done:
                      type: boolean
                    remind_at:
                      type: string
                      format: date-time
              notes:
                type: string
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - note
            - checklist
            - planner
        title:
          type: string
        content:
          oneOf:
            - $ref: "#/components/schemas/NoteContent"
            - $ref: "#/components/schemas/ChecklistContent"
            - $ref: "#/components/schemas/SectionedContent"
        pinned:
          type: boolean
        created_by:
          type: string
          enum:
            - chatgpt
            - user
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
